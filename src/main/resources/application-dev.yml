spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always

rabbitmq:
  host: ${MQ_HOST}
  port: ${MQ_PORT}
  username: ${MQ_USER}
  password: ${MQ_PASS}
  virtual-host: /  

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true
jackson:
  serialization:
    indent_output: true